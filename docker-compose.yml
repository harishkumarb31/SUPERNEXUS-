version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: regulaflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: regulaflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d regulaflow']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: regulaflow-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/regulaflow?schema=public'
      JWT_SECRET: 'regulaflow-super-secret-jwt-key-sih-2026-production-grade'
      CLIENT_URL: 'http://localhost:5173'
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: regulaflow-web
    restart: always
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  postgres_data:
  uploads_data:

